[project]
name = "ai-usage-kit"
version = "0.1.0"
description = "Local reports and settings that cut AI coding agent token spend."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-usage-kit = "ai_usage_kit.cli:main"
eai = "ai_usage_kit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
